name: tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write   # tags: attach the build to the release

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the panel from source (universal)
        run: bash plugin/app/build.sh plugin/bin/Spyglass --universal
      - name: Run the tests on that build
        run: bash tests/run.sh
      - name: Checksum
        run: |
          mkdir -p dist
          cp plugin/bin/Spyglass dist/Spyglass
          (cd dist && shasum -a 256 Spyglass | tee Spyglass.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: Spyglass-universal
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Spyglass-universal
          path: dist
      - name: Attach the CI build to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Spyglass dist/Spyglass.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "Spyglass ${GITHUB_REF_NAME#v}" \
            --notes "Universal macOS binary built by CI from this tag, with its SHA-256. See CHANGELOG.md."
